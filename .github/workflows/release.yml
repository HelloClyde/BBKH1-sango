name: H1 build and prerelease
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned GNU toolchain and Python dependencies
        shell: pwsh
        run: |
          python tools/install_h1_toolchain.py
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain installation failed' }
          python -m pip install -r requirements-h1.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Clean source build and exact physical-evidence gate
        shell: pwsh
        run: |
          python h1/build_h1.py --assets
          if ($LASTEXITCODE -ne 0) { throw 'H1 source build failed' }
          python tools/verify_h1_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Physical evidence or package hash mismatch' }
      - name: Compiled MIPS checks with modeled firmware services
        shell: pwsh
        run: |
          python h1/test_landscape.py
          if ($LASTEXITCODE -ne 0) { throw 'H1 MIPS checks failed' }
          python h1/check_uniform_footer.py
          if ($LASTEXITCODE -ne 0) { throw 'Uniform footer render failed' }
          python h1/test_save_paths.py
          if ($LASTEXITCODE -ne 0) { throw 'Game-data save path checks failed' }
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content dist/h1/BUILD_INFO.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne ('v' + $version)) { throw 'Tag and package version differ' }
          if (!(Test-Path ('releases/' + $env:RELEASE_TAG + '.md'))) { throw 'Release notes missing' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BBKH1-sango
          path: dist/h1/*
          archive: true
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BBKH1-sango
          path: dist/h1
          skip-decompress: false
          digest-mismatch: error
      - name: Verify the same build artifacts and publish without overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python -m pip install Pillow==12.3.0
          python tools/verify_h1_release.py
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release exists; refusing to overwrite assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/h1/* --verify-tag --prerelease --title "三国霸业 H1 $RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md"
